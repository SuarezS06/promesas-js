<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 02</title>
</head>
<body>

    <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  }

  form {
    width: 380px;
    padding: 30px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }

  form > div:first-child {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
  }

  form > div {
    margin-bottom: 14px;
  }

  label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    font-weight: bold;
    color: #444;
  }

  input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    transition: border-color 0.2s;
  }

  input:focus {
    outline: none;
    border-color: #2c5364;
  }

  button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #2c5364;
    color: #ffffff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover {
    background: #203a43;
  }
</style>


    <form action="" id="formBuscador">
      <div>
        <input type="text" id="idnave" placeholder="......ID......" />
        <button type="submit">Buscar</button>
      </div>

      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" />
      </div>

      <div>
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" />
      </div>

      <div>
        <label for="fabricante">Fabricante</label>
        <input type="text" id="fabricante" />
      </div>

      <div>
        <label for="costo">Costo en creditos</label>
        <input type="text" id="costo">
      </div>

      <div>
        <label for="tripulacion">Tripulacion</label>
        <input type="text" id="tripulacion">
      </div>

    </form>


    <script>
      const formulario = document.getElementById("formBuscador");
      const id = document.getElementById("idnave");
      const nombre = document.getElementById("nombre");
      const modelo = document.getElementById("modelo");
      const fabricante = document.getElementById("fabricante");
      const costo = document.getElementById("costo");
      const tripulacion = document.getElementById("tripulacion");
      formulario.addEventListener("submit", (event) => {
        event.preventDefault();

        obtenerNave(id.value);
      });

      async function obtenerNave(id) {
        const API_URL = `https://www.swapi.tech/api/starships/${id}`;

        try {
          const respuesta = await fetch(API_URL);

          if (!respuesta.ok) {
            if (respuesta.status == 404){
              nombre.value = ''
              modelo.value = ''
              fabricante.value = ''
              costo.value = ''
              tripulacion.value = ''
              alert('No existe esta nave espacial')
            }
            throw new Error(`Error de comunicación`);
          }

          const datos = await respuesta.json();
          const nave = datos.result.properties;

          nombre.value = nave.name;
          modelo.value = nave.model;
          fabricante.value = nave.manufacturer;
          costo.value = nave.cost_in_credits;
          tripulacion.value = nave.crew;
        } catch (e) {
          console.error(e);
        }
      }
    </script>

</body>
</html>
